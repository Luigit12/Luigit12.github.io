<script charset="utf-8" type="text/javascript">
 jQuery(function(){
  // Get list of upcoming iCal events formatted in JSON
    jQuery.getJSON("https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.caltorss.com%2Fapi%2Fconvert%3Fics%3DBYFxAcGcC4HpYMYEMA2BTAdgEyQJwHQDmA9sYevgsQLaKqY66wCWyKsaATAmgEa%2BcADAEYAnABYAHADNJwzgDZO00SOmcArAHZewjeIkJRCDRrQLJfLQGZRwy%2BPEJrWDVi3TeCLJ3FYFAKTigoS4xACu4JT02HhEpORolDSw4OG8KKywvEiQrPiskEA", function(data){
      // Utility method to pad a string on the left
      // Source: https://sajjadhossain.com/2008/10/31/javascript-string-trimming-and-padding/
      
      function lpad(str, pad_string, length) {
        var str = new String(str);
        while (str.length < length)
          str = pad_string + str;
        return str;
      };
      // Parse and render each event
      jQuery.each(data.items, function(i, item){
        console.log(item);
        
        if(i == 0) {
          jQuery("#next-gigs li").first().hide();
        };
        var event_url = jQuery.trim(item.link);
        var event_header = item.title;
        if(event_url.length > 0) {
          event_header = "<a href='" + event_url + "'>" + event_header + "</a>";
        };

        // Format the date string
        var d = new Date(item.pubDate);
        var d_string = '<strong>' + d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate() + '</strong>';
        if(d.getHours() != 0 || d.getMinutes() != 0) {
          d_string = d_string + ' at ' + lpad(d.getHours(), '0', 2) + ':' + lpad(d.getMinutes(), '0', 2);
        };
        // Render the event
        jQuery("#next-gigs li").last().before(
          "<li><strong>"
          + event_header
          + "</strong>"
          + "<br>"
          + item.content
          + "</li>"
          + "<br>"
        );
      });
    });
  });
</script>
