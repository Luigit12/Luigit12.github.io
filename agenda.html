<script charset="utf-8" type="text/javascript">
 jQuery(function(){
  // Get list of upcoming iCal events formatted in JSON
  jQuery.get("https://calendar.google.com/calendar/ical/e2cebb201948f81262f901f257b15494c9c55e68eb73918e44c3d5d7fbcd24d6%40group.calendar.google.com/public/basic.ics", function(data) {
    jSonCal = ICAL.parse(data);
      // Utility method to pad a string on the left
      // Source: https://sajjadhossain.com/2008/10/31/javascript-string-trimming-and-padding/
      
      function lpad(str, pad_string, length) {
        var str = new String(str);
        while (str.length < length)
        str = pad_string + str;
      return str;
    };
    // Parse and render each event
    for (let i=0; i<jSonCal[2].length; i++) {
      console.log(jSonCal[2][i]);
      
      if(i == 0) {
        jQuery("#next-gigs li").first().hide();
      };
      var event_header = jSonCal[2][i][1][10][3];
      function parseISOString(s) {
        var b = s.split(/\D+/);
        return new Date(Date.UTC(b[0], --b[1], b[2], b[3], b[4], b[5], b[6]));
      }
      
      // Format the date string
      var d = new Date(parseISOString(jSonCal[2][i][1][0][3]));
      
      var d_string = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
      if(d.getHours() != 0 || d.getMinutes() != 0) {
        d_string = d_string + ' at ' + lpad(d.getHours(), '0', 2) + ':' + lpad(d.getMinutes(), '0', 2);
      };
      // Render the event
      jQuery("#next-gigs li").last().before(
        "<li><strong>"
          + event_header
          + "</strong>"
          + ": "
          + d_string
          + "<br>"
          + jSonCal[2][i][1][5][3]
          + "</li>"
          + "<br>"
        );
      };
    });
  });
</script>
